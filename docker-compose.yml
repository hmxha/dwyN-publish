name: dyw-n-test

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE in .env}
  restart: unless-stopped
  working_dir: /vietnam
  mem_limit: ${APP_MEMORY_LIMIT:-320m}
  environment: &app-environment
    TZ: ${TZ:-Asia/Shanghai}
    GOMAXPROCS: ${APP_GOMAXPROCS:-1}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    DATABASE_HOST: mysql
    DATABASE_PORT: "3306"
    DATABASE_DBNAME: game_vietnam
    DATABASE_USERNAME: root
    DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    PAYMENT_SECRET: ${PAYMENT_SECRET:-test-disabled}
    PAYMENT_FLYER_KEY: ${PAYMENT_FLYER_KEY:-test-disabled}
    PAYMENT_MID: ${PAYMENT_MID:-test-disabled}
    XWORLD_SECRET_KEY: ${XWORLD_SECRET_KEY:-test-disabled}
    XWORLD_MCH_ID: ${XWORLD_MCH_ID:-test-disabled}
    DINGDING_DING_TOKEN: ${DINGDING_DING_TOKEN:-test-disabled}
    SHUSHU_APP_ID: ${SHUSHU_APP_ID:-test-disabled}
  volumes:
    - ./.runtime/conf:/vietnam/conf:z
    - ./.runtime/log:/vietnam/log:z
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "kill -0 1"]
    interval: 15s
    timeout: 3s
    retries: 5
  networks:
    - vietnam_net

services:
  mysql:
    image: mysql:8.0.28
    restart: unless-stopped
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1536m}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: game_vietnam
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --innodb-buffer-pool-size=768M
      - --max-connections=180
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.runtime/mysql-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 10m
    networks:
      - vietnam_net

  redis:
    image: redis:6.2.5
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - vietnam_net

  nginx-gateway:
    image: nginx:1.25-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
    volumes:
      - ./.runtime/nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ./.runtime/nginx/www:/www:ro,z
      - ./.runtime/nginx/log:/var/log/nginx:z
    networks:
      - vietnam_net

  lobby:
    <<: *app
    command: []
    ports:
      - "3658:3658"
      - "6034:6034"

  admin:
    <<: *app
    command: ["admin/config.toml"]
    ports:
      - "6043:6043"

  robot:
    <<: *app
    command: ["robot/config.toml"]

  minigame:
    <<: *app
    command: ["minigame/config.toml"]
    ports:
      - "1000:3658"
      - "1034:6034"

  smxw_1:
    <<: *app
    mem_limit: ${SMXW_MEMORY_LIMIT:-512m}
